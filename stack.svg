<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-labelledby="t d">
  <title id="t">Tech stack</title>
  <desc id="d">Frontend: React, Next.js, TypeScript. Backend: Node.js, Express, Django. Data: MongoDB, PostgreSQL.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="899" height="239" rx="16" fill="#0a0a0a" stroke="#262626"/>

  <g class="mono" font-size="12" fill="#9a9a9a">
    <text x="40" y="60">frontend</text>
    <text x="340" y="60">backend</text>
    <text x="640" y="60">data</text>
  </g>

  <g class="sans" font-size="15" fill="#ececec">
    <!-- frontend -->
    <rect x="40.5" y="78.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.01;0.03;0.11;0.13;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="102">React</text>
    <rect x="40.5" y="124.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.13;0.15;0.23;0.25;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="148">Next.js</text>
    <rect x="40.5" y="170.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.25;0.27;0.35;0.37;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="58" y="194">TypeScript</text>

    <!-- backend -->
    <rect x="340.5" y="78.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.37;0.39;0.47;0.49;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="358" y="102">Node.js</text>
    <rect x="340.5" y="124.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.49;0.51;0.59;0.61;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="358" y="148">Express</text>
    <rect x="340.5" y="170.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.61;0.63;0.71;0.73;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="358" y="194">Django</text>

    <!-- data -->
    <rect x="640.5" y="78.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.73;0.75;0.83;0.85;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="658" y="102">MongoDB</text>
    <rect x="640.5" y="124.5" width="220" height="38" rx="10" fill="#0f0f0f" stroke="#2a2a2a">
      <animate attributeName="stroke" values="#2a2a2a;#2a2a2a;#6b6b6b;#6b6b6b;#2a2a2a;#2a2a2a" keyTimes="0;0.85;0.87;0.95;0.97;1" dur="14s" repeatCount="indefinite"/>
    </rect>
    <text x="658" y="148">PostgreSQL</text>
  </g>
</svg>
